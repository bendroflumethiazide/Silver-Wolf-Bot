name: Desktop release (Windows)

# Builds the Windows installer + portable exe on a real Windows runner (icon embedded).
# Run it from the Actions tab (publishes v<package.json version>) or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build app server
        run: pnpm run desktop:prepare
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package (installer + portable)
        run: pnpm exec electron-builder --win nsis portable --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: silver-wolf-bot-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag pushes use their own name; manual runs use the version in package.json.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            gh release create "$TAG" release/*.exe --target "$GITHUB_SHA" \
              --title "Silver Wolf Bot $TAG" \
              --notes "Windows installer (Silver-Wolf-Bot-Setup-*.exe) and portable exe (no install). Unsigned build: Windows SmartScreen may warn, choose More info, then Run anyway. Your data is kept in %APPDATA%\\silver-wolf-bot."
          fi

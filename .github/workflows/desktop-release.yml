name: Desktop release (Windows)

# Builds the Windows installer + portable exe on a real Windows runner (icon embedded).
# Run it manually from the Actions tab, or push a tag like v1.0.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build app server
        run: pnpm run desktop:prepare
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package (installer + portable)
        run: pnpm exec electron-builder --win nsis portable --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: silver-wolf-bot-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe \
            --title "Silver Wolf Bot $GITHUB_REF_NAME" \
            --notes "Windows installer (Silver-Wolf-Bot-Setup-*.exe) and portable exe. Unsigned build: Windows SmartScreen may warn — choose More info → Run anyway."

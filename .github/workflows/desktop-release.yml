name: Desktop release (Windows)

# Builds the Windows installer + portable exe on a real Windows runner (icon embedded).
# Run it from the Actions tab (publishes v<package.json version>) or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build app server
        run: pnpm run desktop:prepare
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package (installer + portable)
        shell: bash
        # On Windows the exe's icon and version info can be embedded (no code signing certificate is used).
        run: pnpm exec electron-builder --win nsis portable --x64 --publish never --config.win.signAndEditExecutable=true
      - name: Smoke test the packaged app server on Windows
        shell: bash
        run: |
          cd "release/win-unpacked/resources/server"
          ELECTRON_RUN_AS_NODE=1 NODE_ENV=production PORT=47999 HOSTNAME=127.0.0.1 ASTRAL_LOCAL_ONLY=1 \
            "../../Silver Wolf Bot.exe" server.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          ok=""
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:47999/; then ok=1; echo "server answered after ~${i}s"; break; fi
            sleep 1
          done
          echo "---- server output"; cat "$RUNNER_TEMP/smoke.log"
          [ -n "$ok" ] || { echo "server did not answer"; exit 1; }
          for page in /warp /settings /terminal; do curl -sf -o /dev/null "http://127.0.0.1:47999$page" && echo "ok $page"; done
          taskkill //F //IM "Silver Wolf Bot.exe" || true
      - uses: actions/upload-artifact@v4
        with:
          name: silver-wolf-bot-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag pushes use their own name; manual runs use the version in package.json.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            gh release create "$TAG" release/*.exe --target "$GITHUB_SHA" \
              --title "Silver Wolf Bot $TAG" \
              --notes "Windows installer (Silver-Wolf-Bot-Setup-*.exe) and portable exe (no install). Unsigned build: Windows SmartScreen may warn, choose More info, then Run anyway. Your data is kept in %APPDATA%\\silver-wolf-bot."
          fi
